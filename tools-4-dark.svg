<svg xmlns="http://www.w3.org/2000/svg" width="412" height="194" viewBox="0 0 412 194" role="img" fill="none"><title>Lately: Learning — Advanced TypeScript patterns, 3D on the web, and video production. Off the clock — Playing piano.</title><style>@font-face{font-family:'Archivo Label';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.AL{font-family:'Archivo Label',-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:600;font-style:normal}@font-face{font-family:'Newsreader';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.NS{font-family:'Newsreader',Georgia, 'Times New Roman', serif;font-weight:400;font-style:normal}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}@keyframes lineup{from{transform:translateY(var(--from))}}@keyframes odo{from{transform:translateY(0)}to{transform:translateY(var(--to))}}@keyframes stop{from{fill-opacity:0}}.rise{animation:rise 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.fade{animation:fade 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.grow{animation:grow 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 100%}.growx{animation:growx 1100ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:0 50%}.pop{animation:pop 520ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 50%}.lineup{animation:lineup 1000ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.odo{animation:odo 1600ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.stop{animation:stop 480ms cubic-bezier(0.23, 1, 0.32, 1) backwards}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect class="growx" style="animation-delay:80ms" x="8" y="13.5" width="396" height="1" fill="#f3f1ec"/><text x="8" y="33" class="fade" style="animation-delay:200ms"><tspan class="AL" font-size="11" letter-spacing="1.32" fill="#f3f1ec">LATELY</tspan></text><text x="8" y="66" class="fade" style="animation-delay:260ms"><tspan class="AL" font-size="11" letter-spacing="1.32" fill="#ff8a63">LEARNING</tspan></text><text x="8" y="88" class="rise" style="animation-delay:300ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">Advanced TypeScript patterns, 3D on the web, and</tspan></text><text x="8" y="112" class="rise" style="animation-delay:340ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">video production.</tspan></text><text x="8" y="142" class="fade" style="animation-delay:340ms"><tspan class="AL" font-size="11" letter-spacing="1.32" fill="#ff8a63">OFF THE CLOCK</tspan></text><text x="8" y="164" class="rise" style="animation-delay:380ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">Playing piano.</tspan></text></svg>
