<svg xmlns="http://www.w3.org/2000/svg" width="824" height="119" viewBox="0 0 824 119" role="img" fill="none"><title>Tools. What I reach for, from the browser down to the plant floor.</title><style>@font-face{font-family:'Plex Mono Medium';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.PB{font-family:'Plex Mono Medium',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500;font-style:normal}@font-face{font-family:'Archivo Label';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.AL{font-family:'Archivo Label',-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:600;font-style:normal}@font-face{font-family:'Archivo Expanded';font-weight:900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.AX{font-family:'Archivo Expanded',-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:900;font-style:normal}@font-face{font-family:'Newsreader Italic';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}.NI{font-family:'Newsreader Italic',Georgia, 'Times New Roman', serif;font-weight:400;font-style:italic}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}@keyframes lineup{from{transform:translateY(var(--from))}}@keyframes odo{from{transform:translateY(0)}to{transform:translateY(var(--to))}}@keyframes stop{from{fill-opacity:0}}.rise{animation:rise 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.fade{animation:fade 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.grow{animation:grow 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 100%}.growx{animation:growx 1100ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:0 50%}.pop{animation:pop 520ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 50%}.lineup{animation:lineup 1000ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.odo{animation:odo 1600ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.stop{animation:stop 480ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.kw{cursor:pointer;transition:fill 150ms ease-out,filter 150ms ease-out}.kw:hover{fill:#e8481c!important;filter:drop-shadow(0 0 8px #e8481ccc)}.kw-giant,.stop{cursor:pointer;transition:fill 180ms ease-out,filter 180ms ease-out}.kw-giant:hover,.stop:hover{filter:drop-shadow(0 0 12px #e8481c99)}</style><defs><clipPath id="rvd"><rect x="0" y="32.2" width="824" height="72"/></clipPath></defs><rect class="growx" style="animation-delay:0ms" x="8" y="13.25" width="808" height="1.5" fill="#111110"/><text x="8" y="33" class="fade" style="animation-delay:150ms"><tspan class="PB kw" font-size="11" letter-spacing="0.44" fill="#c0390e">03</tspan></text><text x="816" y="33" text-anchor="end" class="fade" style="animation-delay:210ms"><tspan class="AL" font-size="11" letter-spacing="1.32" fill="#55534f">FRONT TO BACK</tspan></text><g clip-path="url(#rvd)"><g class="lineup" style="--from:63px;animation-delay:120ms"><text x="6" y="93.4"><tspan class="AX" font-size="60" letter-spacing="-2.1" fill="#111110">TOOLS</tspan><tspan class="AX stop" style="animation-delay:640ms" font-size="60" letter-spacing="-2.1" fill="#e8481c">.</tspan></text></g></g><text x="452" y="67.6" class="rise" style="animation-delay:380ms"><tspan class="NI" font-size="21" letter-spacing="-0.21" fill="#55534f">What I reach for, from the browser down</tspan></text><text x="452" y="94.6" class="rise" style="animation-delay:420ms"><tspan class="NI" font-size="21" letter-spacing="-0.21" fill="#55534f">to the plant floor.</tspan></text></svg>
