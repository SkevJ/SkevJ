<svg xmlns="http://www.w3.org/2000/svg" width="824" height="393" viewBox="0 0 824 393" role="img" fill="none"><title>Kevin Sanchez — Full-stack developer, San Pedro Sula · Honduras</title><style>@font-face{font-family:'Archivo Label';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.AL{font-family:'Archivo Label',-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:600;font-style:normal}@font-face{font-family:'Archivo Expanded';font-weight:900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.AX{font-family:'Archivo Expanded',-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:900;font-style:normal}@font-face{font-family:'Newsreader Italic';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}.NI{font-family:'Newsreader Italic',Georgia, 'Times New Roman', serif;font-weight:400;font-style:italic}@font-face{font-family:'Newsreader';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.NS{font-family:'Newsreader',Georgia, 'Times New Roman', serif;font-weight:400;font-style:normal}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}@keyframes lineup{from{transform:translateY(var(--from))}}@keyframes odo{from{transform:translateY(0)}to{transform:translateY(var(--to))}}@keyframes stop{from{fill-opacity:0}}.rise{animation:rise 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.fade{animation:fade 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.grow{animation:grow 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 100%}.growx{animation:growx 1100ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:0 50%}.pop{animation:pop 520ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 50%}.lineup{animation:lineup 1000ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.odo{animation:odo 1600ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.stop{animation:stop 480ms cubic-bezier(0.23, 1, 0.32, 1) backwards}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="rv1"><rect x="0" y="6.96" width="824" height="141.6"/></clipPath><clipPath id="rv2"><rect x="0" y="117.88" width="824" height="141.6"/></clipPath></defs><rect class="growx" style="animation-delay:0ms" x="8" y="13.25" width="808" height="1.5" fill="#111110"/><text x="8" y="33" class="fade" style="animation-delay:150ms"><tspan class="AL" font-size="11" letter-spacing="1.32" fill="#111110">FULL-STACK DEVELOPER</tspan></text><text x="816" y="33" text-anchor="end" class="fade" style="animation-delay:210ms"><tspan class="AL" font-size="11" letter-spacing="1.32" fill="#55534f">SAN PEDRO SULA · HONDURAS</tspan></text><g clip-path="url(#rv1)"><g class="lineup" style="--from:123.9px;animation-delay:120ms"><text x="6" y="127.32"><tspan class="AX" font-size="118" letter-spacing="-4.13" fill="#111110">KEVIN</tspan></text></g></g><g clip-path="url(#rv2)"><g class="lineup" style="--from:123.9px;animation-delay:210ms"><text x="6" y="238.24"><tspan class="AX" font-size="118" letter-spacing="-4.13" fill="#111110">SANCHEZ</tspan><tspan class="AX stop" style="animation-delay:820ms" font-size="118" letter-spacing="-4.13" fill="#e8481c">.</tspan></text></g></g><rect class="growx" style="animation-delay:420ms" x="8" y="263.74" width="808" height="1" fill="#111110"/><text x="8" y="300.24" class="rise" style="animation-delay:860ms"><tspan class="NI" font-size="21" letter-spacing="-0.21" fill="#111110">Hola, I’m Kevin.</tspan></text><text x="330" y="298.24" class="rise" style="animation-delay:900ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#111110">I build enterprise software end to end: React and TypeScript on</tspan></text><text x="330" y="322.24" class="rise" style="animation-delay:940ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#111110">the front, C# and SQL Server underneath, and serial cables down</tspan></text><text x="330" y="346.24" class="rise" style="animation-delay:980ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#111110">to the machines on the plant floor. Most of it lives in private</tspan></text><text x="330" y="370.24" class="rise" style="animation-delay:1020ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#111110">repositories.</tspan></text></svg>
