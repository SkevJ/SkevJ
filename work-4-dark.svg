<svg xmlns="http://www.w3.org/2000/svg" width="412" height="226" viewBox="0 0 412 226" role="img" fill="none"><title>Tested before it ships. Automated tests on both ends run before every deploy. A red test means it doesn’t ship.</title><style>@font-face{font-family:'Archivo Expanded';font-weight:900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.AX{font-family:'Archivo Expanded',-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:900;font-style:normal}@font-face{font-family:'Newsreader';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.NS{font-family:'Newsreader',Georgia, 'Times New Roman', serif;font-weight:400;font-style:normal}@font-face{font-family:'Plex Mono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.PM{font-family:'Plex Mono',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-style:normal}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}@keyframes lineup{from{transform:translateY(var(--from))}}@keyframes odo{from{transform:translateY(0)}to{transform:translateY(var(--to))}}@keyframes stop{from{fill-opacity:0}}.rise{animation:rise 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.fade{animation:fade 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.grow{animation:grow 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 100%}.growx{animation:growx 1100ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:0 50%}.pop{animation:pop 520ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 50%}.lineup{animation:lineup 1000ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.odo{animation:odo 1600ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.stop{animation:stop 480ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.kw{cursor:pointer;transition:fill 150ms ease-out,filter 150ms ease-out}.kw:hover{fill:#ff6b3d!important;filter:drop-shadow(0 0 8px #ff6b3dcc)}.kw-giant,.stop{cursor:pointer;transition:fill 180ms ease-out,filter 180ms ease-out}.kw-giant:hover,.stop:hover{filter:drop-shadow(0 0 12px #ff6b3d99)}</style><defs></defs><rect class="growx" style="animation-delay:80ms" x="8" y="13.5" width="396" height="1" fill="#f3f1ec"/><text x="6" y="66" class="rise" style="animation-delay:200ms"><tspan class="AX kw" font-size="40" letter-spacing="-1.2" fill="#ff6b3d">04</tspan></text><text x="8" y="104" class="rise" style="animation-delay:260ms"><tspan class="AX kw" font-size="20" letter-spacing="-0.2" fill="#f3f1ec">Tested before it ships</tspan></text><text x="8" y="134" class="rise" style="animation-delay:320ms"><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">Automated tests</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#a3a09a"> on both ends run before</tspan></text><text x="8" y="158" class="rise" style="animation-delay:360ms"><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">every deploy</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#a3a09a">. A </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">red test</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#a3a09a"> means it </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">doesn’t ship</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#a3a09a">.</tspan></text><text x="8" y="214" class="fade" style="animation-delay:500ms"><tspan class="PM kw" font-size="9.5" letter-spacing="0.76" fill="#96938b">UNIT TESTS</tspan><tspan class="PM" font-size="9.5" letter-spacing="0.76" fill="#96938b"> · </tspan><tspan class="PM kw" font-size="9.5" letter-spacing="0.76" fill="#96938b">CI GATES</tspan><tspan class="PM" font-size="9.5" letter-spacing="0.76" fill="#96938b"> · </tspan><tspan class="PM kw" font-size="9.5" letter-spacing="0.76" fill="#96938b">ZERO-FAULT</tspan></text></svg>
