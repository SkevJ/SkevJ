<svg xmlns="http://www.w3.org/2000/svg" width="824" height="393" viewBox="0 0 824 393" role="img" fill="none"><title>Kevin Sanchez — Full-stack developer, San Pedro Sula · Honduras</title><style>@font-face{font-family:'Archivo Label';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.AL{font-family:'Archivo Label',-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:600;font-style:normal}@font-face{font-family:'Archivo Expanded';font-weight:900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.AX{font-family:'Archivo Expanded',-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;font-weight:900;font-style:normal}@font-face{font-family:'Newsreader Italic';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}.NI{font-family:'Newsreader Italic',Georgia, 'Times New Roman', serif;font-weight:400;font-style:italic}@font-face{font-family:'Newsreader';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.NS{font-family:'Newsreader',Georgia, 'Times New Roman', serif;font-weight:400;font-style:normal}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}@keyframes lineup{from{transform:translateY(var(--from))}}@keyframes odo{from{transform:translateY(0)}to{transform:translateY(var(--to))}}@keyframes stop{from{fill-opacity:0}}.rise{animation:rise 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.fade{animation:fade 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.grow{animation:grow 900ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 100%}.growx{animation:growx 1100ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:0 50%}.pop{animation:pop 520ms cubic-bezier(0.23, 1, 0.32, 1) backwards;transform-box:fill-box;transform-origin:50% 50%}.lineup{animation:lineup 1000ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.odo{animation:odo 1600ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.stop{animation:stop 480ms cubic-bezier(0.23, 1, 0.32, 1) backwards}.kw{cursor:pointer;transition:fill 150ms ease-out,filter 150ms ease-out}.kw:hover{fill:#ff6b3d!important;filter:drop-shadow(0 0 8px #ff6b3dcc)}.kw-giant,.stop{cursor:pointer;transition:fill 180ms ease-out,filter 180ms ease-out}.kw-giant:hover,.stop:hover{filter:drop-shadow(0 0 12px #ff6b3d99)}</style><defs><clipPath id="rv3"><rect x="0" y="6.96" width="824" height="141.6"/></clipPath><clipPath id="rv4"><rect x="0" y="117.88" width="824" height="141.6"/></clipPath></defs><rect class="growx" style="animation-delay:0ms" x="8" y="13.25" width="808" height="1.5" fill="#f3f1ec"/><text x="8" y="33" class="fade" style="animation-delay:150ms"><tspan class="AL kw" font-size="11" letter-spacing="1.32" fill="#f3f1ec">FULL-STACK DEVELOPER</tspan></text><text x="816" y="33" text-anchor="end" class="fade" style="animation-delay:210ms" data-hero-clock="1"><tspan class="AL kw" font-size="11" letter-spacing="1.32" fill="#a3a09a">SAN PEDRO SULA · HONDURAS</tspan></text><g clip-path="url(#rv3)"><g class="lineup" style="--from:123.9px;animation-delay:120ms"><text x="6" y="127.32"><tspan class="AX kw-giant" font-size="118" letter-spacing="-4.13" fill="#f3f1ec">KEVIN</tspan></text></g></g><g clip-path="url(#rv4)"><g class="lineup" style="--from:123.9px;animation-delay:210ms"><text x="6" y="238.24"><tspan class="AX" font-size="118" letter-spacing="-4.13" fill="#f3f1ec">SANCHEZ</tspan><tspan class="AX stop" style="animation-delay:820ms" font-size="118" letter-spacing="-4.13" fill="#ff6b3d">.</tspan></text></g></g><rect class="growx" style="animation-delay:420ms" x="8" y="263.74" width="808" height="1" fill="#f3f1ec"/><text x="8" y="300.24" class="rise" style="animation-delay:860ms"><tspan class="NI kw" font-size="21" letter-spacing="-0.21" fill="#f3f1ec">Hola, I’m Kevin.</tspan></text><text x="330" y="298.24" class="rise" style="animation-delay:900ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">I build </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">enterprise software</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec"> end to end: </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">React</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec"> and </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">TypeScript</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec"> on</tspan></text><text x="330" y="322.24" class="rise" style="animation-delay:940ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">the front, </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">C#</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec"> and </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">SQL Server</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec"> underneath, and direct links down to</tspan></text><text x="330" y="346.24" class="rise" style="animation-delay:980ms"><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">the </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">physical machines</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec"> on the </tspan><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">plant floor</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">. Most of it lives in</tspan></text><text x="330" y="370.24" class="rise" style="animation-delay:1020ms"><tspan class="NS kw" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">private repositories</tspan><tspan class="NS" font-size="16.5" letter-spacing="-0.05" fill="#f3f1ec">.</tspan></text></svg>
